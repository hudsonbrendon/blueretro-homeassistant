# This repo is a Home Assistant HACS custom integration (custom_components/blueretro),
# not a Python package. The BLE library lives in its own repo and on PyPI as
# `blueretro-ble` (https://github.com/hudsonbrendon/blueretro-ble); the integration
# depends on it via manifest.json `requirements`. This pyproject only configures
# the dev/test toolchain; install test deps with `pip install -r requirements_test.txt`.

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "ANN", "ASYNC", "RUF"]
# D102/D107: entity property/`__init__` docstrings add noise; HA conventions cover them.
ignore = ["D102", "D107", "D203", "D213", "ANN401", "RUF012", "E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
force-sort-within-sections = true
combine-as-imports = true
known-first-party = ["custom_components.blueretro"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "RUF", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
