list_config_files:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: blueretro

delete_config_file:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: blueretro
    name:
      required: true
      example: GALE01
      selector:
        text:

get_input_mapping:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: blueretro
    config_id:
      required: true
      default: 0
      selector:
        number:
          min: 0
          max: 16
          mode: box

set_input_mapping:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: blueretro
    config_id:
      required: true
      default: 0
      selector:
        number:
          min: 0
          max: 16
          mode: box
    mappings:
      required: true
      selector:
        object:

list_presets:

apply_preset:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: blueretro
    preset:
      required: true
      example: n64_fps
      selector:
        text:
    config_id:
      default: 0
      selector:
        number:
          min: 0
          max: 16
          mode: box
    port:
      default: 0
      selector:
        number:
          min: 0
          max: 11
          mode: box

backup_memory_card:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: blueretro
    card:
      selector:
        select:
          translation_key: card
          options:
            - vmu
            - controller_pak
    bank:
      default: 1
      selector:
        number:
          min: 1
          max: 4
          mode: box

restore_memory_card:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: blueretro
    path:
      required: true
      example: /media/blueretro/BlueRetro_DC_2A6E_20261025-150000.vmu
      selector:
        text:
    card:
      selector:
        select:
          translation_key: card
          options:
            - vmu
            - controller_pak
    bank:
      default: 1
      selector:
        number:
          min: 1
          max: 4
          mode: box

format_controller_pak:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: blueretro
    bank:
      default: 1
      selector:
        number:
          min: 1
          max: 4
          mode: box
